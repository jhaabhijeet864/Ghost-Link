name: LocalLoop CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-net:
    name: Build & Test .NET Backend
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore LocalLoop.sln

    - name: Build solution
      run: dotnet build LocalLoop.sln --configuration Release --no-restore

    - name: Run .NET Unit & Integration Tests
      run: dotnet test src/LocalLoop.Tests/LocalLoop.Tests.csproj --configuration Release --no-build --verbosity normal

  mobile-flutter:
    name: Analyze & Test Flutter Companion
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      working-directory: ./mobile
      run: flutter pub get

    - name: Static code analysis
      working-directory: ./mobile
      run: flutter analyze --no-fatal-infos

    - name: Run Riverpod & Unit tests
      working-directory: ./mobile
      run: flutter test test/connection_state_test.dart test/telemetry_state_test.dart
